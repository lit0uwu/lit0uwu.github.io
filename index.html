<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>litouwu.net</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0a0a0a;
            color: #ffffff;
            font-family: 'Courier New', Courier, serif; 
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh; 
            padding: 20px;
        }

        h1 {
            font-size: 3.5rem;
            margin-bottom: 5px;
            text-align: center;
            letter-spacing: 2px;
        }

        p.subtitle {
            font-size: 1rem;
            color: #888888; 
            margin-bottom: 40px;
            font-style: italic;
        }

        .links-container {
            display: flex;
            flex-direction: column;
            gap: 20px; 
            width: 100%;
            max-width: 400px; 
        }

        .link-btn {
            display: block;
            text-decoration: none;
            color: #ffffff;
            background-color: transparent;
            border: 2px solid #333333;
            padding: 15px 20px;
            text-align: center;
            font-size: 1.2rem;
            font-family: Arial, sans-serif;
            font-weight: bold;
            transition: all 0.3s ease; 
            border-radius: 8px; 
        }

        .link-btn:hover {
            border-color: #ff0000;
            background-color: rgba(255, 0, 0, 0.1);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 0, 0, 0.2);
        }

        .btn-tg:hover { border-color: #0088cc; background-color: rgba(0, 136, 204, 0.1); box-shadow: 0 5px 15px rgba(0, 136, 204, 0.2); }
        .btn-twitch:hover { border-color: #9146FF; background-color: rgba(145, 70, 255, 0.1); box-shadow: 0 5px 15px rgba(145, 70, 255, 0.2); }
        
        footer {
            margin-top: 50px;
            font-size: 0.8rem;
            color: #555555;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>

    <h1>litouwu.net</h1>
    <p class="subtitle">не вздумай заходить</p>

    <div class="links-container">

        <a href="https://t.me/litouwu" class="link-btn btn-tg" target="_blank">
            Telegram
        </a>

        <a href="https://youtube.com/@litouwu" class="link-btn" target="_blank">
            YouTube 
        </a>

        <a href="https://twitch.tv/l1touwu" class="link-btn btn-twitch" target="_blank">
            Twitch
        </a>

        <a href="https://twitch.tv/l1touwu" class="link-btn btn-MusiTechne" target="_blank">
            MusiTechne (WIP)
        </a>
        
    </div>

    <footer>
        <p>Лито</p>
    </footer>

</body>
</html>
